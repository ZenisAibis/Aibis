<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1b2d">
<title>z.Aibis カメラ</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjM2IiBmaWxsPSIjMGYxYjJkIi8+PGNpcmNsZSBjeD0iOTYiIGN5PSIxMDgiIHI9IjM0IiBmaWxsPSJub25lIiBzdHJva2U9IiNmNTllMGIiIHN0cm9rZS13aWR0aD0iOCIvPjxyZWN0IHg9IjU2IiB5PSI2NCIgd2lkdGg9IjgwIiBoZWlnaHQ9IjE2IiByeD0iNiIgZmlsbD0iIzM0ZTNkMCIvPjx0ZXh0IHg9Ijk2IiB5PSIxMTYiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNiIgZm9udC13ZWlnaHQ9IjkwMCIgZmlsbD0iI2Y1OWUwYiIgdGV4dC1hbmNob3I9Im1pZGRsZSI+ei48L3RleHQ+PC9zdmc+">
<style>
  :root{
    --bg:#0f1b2d; --panel:#16263d; --panel2:#1d3251;
    --line:#27405f; --navy:#2c5282; --gold:#f59e0b; --gold2:#d97706;
    --teal:#34e3d0; --txt:#e8eef6; --dim:#8aa0bd; --danger:#ff5d7d; --ok:#34e3d0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    overscroll-behavior:none;}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  .hide{display:none!important}
  .scr{flex:1;min-height:0;display:flex;flex-direction:column}

  .top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
    background:linear-gradient(180deg,rgba(15,27,45,.96),rgba(15,27,45,.7));backdrop-filter:blur(6px);z-index:10}
  .top .ttl{font-size:13px;font-weight:800;letter-spacing:.5px;color:var(--gold)}
  .top .sub{font-size:11px;color:var(--dim);font-weight:600}
  .tbtn{padding:7px 11px;border-radius:9px;background:var(--panel2);font-size:12.5px;font-weight:700;white-space:nowrap}
  .tbtn:active{background:#264168}
  .tbtn .cnt{color:var(--teal);font-weight:900;margin-left:2px}
  .tbtn .cnt.warn{color:var(--gold)}
  .tbtn .cnt.over{color:var(--danger)}
  .vertag{font-size:10.5px;font-weight:700;color:var(--dim);flex:0 0 auto;letter-spacing:.3px}
  .grow{flex:1;min-width:0}
  .cardchip{display:flex;flex-direction:column;min-width:0}
  .cardchip b{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #camWrap{position:relative;flex:1;min-height:170px;background:#000;overflow:hidden}
  #video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
  #flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #flashfx.go{animation:flash .28s ease-out}
  @keyframes flash{0%{opacity:.0}15%{opacity:.85}100%{opacity:0}}
  #guide{position:absolute;inset:0;pointer-events:none}
  #guide .grid line{stroke:rgba(255,255,255,.28);stroke-width:1}
  .gpschip{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;pointer-events:none}
  .gpschip span{background:rgba(15,27,45,.8);border:1px solid var(--line);padding:5px 12px;border-radius:18px;
    font-size:11.5px;font-weight:700;color:var(--dim);max-width:92%;text-align:center}
  .gpschip span b{color:var(--teal)}
  .errcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:28px;text-align:center}
  .errcard .em{font-size:13px;color:var(--dim);line-height:1.7}

  /* 仕分けパネル（撮影画面の下） */
  #setPanel{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px;max-height:44vh;overflow-y:auto}
  .setstrip{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .sthumb{width:54px;height:54px;border-radius:9px;overflow:hidden;background:var(--panel2);position:relative;flex:0 0 auto;border:1.5px solid var(--line)}
  .sthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .setcnt{margin-left:auto;font-size:13px;font-weight:900;color:var(--teal);flex:0 0 auto}
  .setcnt.full{color:var(--gold)}

  .addrline{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
  .addrline .at{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .addrline .at.pend{color:var(--dim)}
  .mini{padding:7px 11px;border-radius:9px;background:var(--panel2);font-size:12.5px;font-weight:700;flex:0 0 auto}
  .mini:active{background:#264168}
  .mini.danger{background:rgba(255,93,125,.16);color:var(--danger)}
  .banchiline{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .banchiline .bl{font-size:12px;color:var(--dim);font-weight:700;flex:0 0 auto}
  .banchi{flex:1;min-width:80px;padding:10px 13px;border-radius:11px;background:var(--bg);border:1px solid var(--line);
    color:var(--txt);font-size:15px;font-weight:700;letter-spacing:1px}
  .banchi::placeholder{color:var(--dim);font-weight:600;letter-spacing:normal}
  .notewrap{display:flex;gap:8px}
  .notewrap input{flex:1;padding:10px 13px;border-radius:11px;background:var(--bg);border:1px solid var(--line);color:var(--txt);font-size:14px}
  .micbtn{flex:0 0 auto;width:46px;border-radius:11px;background:var(--panel2);font-size:19px}
  .micbtn.rec{background:rgba(255,93,125,.25);color:var(--danger);animation:micpulse 1s infinite}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,93,125,.55)}50%{box-shadow:0 0 0 7px rgba(255,93,125,0)}}

  .shootbar{display:flex;align-items:center;justify-content:space-between;
    padding:12px 22px calc(env(safe-area-inset-bottom) + 14px);background:var(--bg)}
  .iconbtn{width:52px;height:52px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:22px}
  .iconbtn:active{background:#264168}
  .iconbtn.on{background:rgba(245,158,11,.2);color:var(--gold)}
  .shutter{width:78px;height:78px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.35);
    box-shadow:0 0 0 3px var(--gold)}
  .shutter:active{transform:scale(.92)}
  .shutter[disabled]{opacity:.4}
  .donebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    width:62px;height:52px;border-radius:13px;background:var(--panel2);font-weight:800}
  .donebtn b{font-size:18px;line-height:1;color:var(--teal)}
  .donebtn s{font-size:10px;text-decoration:none;color:var(--dim)}
  .donebtn:active{background:#264168}
  .donebtn[disabled]{opacity:.35}

  /* リスト共通 */
  .pad{padding:12px 14px;overflow-y:auto;flex:1;min-height:0}
  .search{width:100%;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
    color:var(--txt);font-size:15px;margin-bottom:10px}
  .search::placeholder{color:var(--dim)}
  .crow{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:13px;background:var(--panel);
    border:1px solid var(--line);margin-bottom:9px}
  .crow:active{background:var(--panel2)}
  .crow .nm{font-size:15px;font-weight:800}
  .crow .mt{font-size:11.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow .pc{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--panel2);border-radius:10px;padding:6px 9px;min-width:48px}
  .crow .pc b{font-size:16px;font-weight:900;color:var(--teal);line-height:1}
  .crow .pc s{font-size:9.5px;color:var(--dim);text-decoration:none}
  .emptyst{text-align:center;color:var(--dim);padding:40px 20px;line-height:1.9;font-size:13.5px}

  /* インボックス/ギャラリー行（データ＝写真の組） */
  .drow{display:flex;gap:11px;padding:10px;border-radius:13px;background:var(--panel);border:1px solid var(--line);margin-bottom:9px;align-items:center}
  .drow .th{flex:0 0 auto;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--panel2);position:relative}
  .drow .th img{width:100%;height:100%;object-fit:cover;display:block}
  .drow .th .n{position:absolute;right:3px;bottom:3px;background:rgba(15,27,45,.85);color:var(--teal);font-size:10px;font-weight:900;padding:1px 6px;border-radius:7px}
  .drow .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .drow .ad{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drow .ad.pend{color:var(--dim);font-weight:600}
  .drow .wn{font-size:11px;color:var(--dim)}
  .drow .delbtn{flex:0 0 auto;width:42px;height:42px;border-radius:11px;background:rgba(255,93,125,.14);color:var(--danger);font-size:18px;display:flex;align-items:center;justify-content:center}
  .drow .delbtn:active{background:rgba(255,93,125,.28)}
  .sentbadge{display:inline-block;font-size:10px;font-weight:800;color:var(--ok);background:rgba(52,227,208,.14);border-radius:7px;padding:1px 7px;margin-left:6px}
  .warnbar{padding:11px 13px;border-radius:12px;margin-bottom:10px;font-size:12.5px;font-weight:700;line-height:1.5}
  .warnbar.soft{background:rgba(245,158,11,.14);color:var(--gold);border:1px solid rgba(245,158,11,.4)}
  .warnbar.hard{background:rgba(255,93,125,.14);color:var(--danger);border:1px solid rgba(255,93,125,.45)}
  .storeline{font-size:11px;color:var(--dim);text-align:center;padding:14px 0 6px}

  .galgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .gcell{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--panel2)}
  .gcell img{width:100%;height:100%;object-fit:cover;display:block}
  .gcell .n{position:absolute;right:4px;bottom:4px;background:rgba(15,27,45,.82);color:var(--teal);font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px}
  .galsec{font-size:12px;font-weight:800;color:var(--gold);margin:14px 2px 7px}

  /* 単写真ビューア */
  #viewer{position:fixed;inset:0;background:rgba(7,12,20,.97);z-index:50;display:flex;flex-direction:column}
  #viewer img#vImg{flex:1;min-height:0;object-fit:contain;width:100%}
  .vtop{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
  .vacts{display:flex;gap:8px;padding:10px 14px calc(env(safe-area-inset-bottom) + 16px)}
  .vbtn{flex:1;padding:13px;border-radius:12px;background:var(--panel2);font-size:14px;font-weight:800;text-align:center}
  .vbtn.danger{background:rgba(255,93,125,.16);color:var(--danger)}
  .vbtn:active{filter:brightness(1.2)}

  /* 数字キーパッド */
  #keypad{position:fixed;inset:0;background:rgba(7,12,20,.6);z-index:70;display:flex;align-items:flex-end}
  .kpcard{width:100%;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px)}
  .kphead{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 12px;font-size:13px;color:var(--dim);font-weight:700}
  .kphead #kpVal{font-size:22px;font-weight:900;color:var(--teal);letter-spacing:2px}
  .kpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .kpgrid button{padding:16px 0;border-radius:13px;background:var(--panel2);font-size:22px;font-weight:800}
  .kpgrid button:active{background:#264168}
  .kpgrid .kpsub{background:#13223a;color:var(--gold);font-size:20px}
  .kpacts{display:flex;gap:9px;margin-top:11px}
  .kpacts button{flex:1;padding:14px;border-radius:13px;font-size:15px;font-weight:800}
  .kpacts .kpx{background:var(--panel2);color:var(--dim)}
  .kpacts .kpok{background:var(--gold);color:#1a1300}

  /* 位置修正マップ */
  #mapEdit{position:fixed;inset:0;background:var(--bg);z-index:75;display:flex;flex-direction:column}
  #leafWrap{position:relative;flex:1;min-height:0}
  #leafMap{position:absolute;inset:0;background:#0a1422}
  #centerPin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none;z-index:600;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
  .mefoot{display:flex;align-items:center;gap:10px;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);background:var(--bg)}
  .mefoot .vbtn{flex:0 0 auto;width:auto;padding:12px 16px}
  .mehint{font-size:11px;color:var(--dim);line-height:1.4}
  .aibis-pin{background:none;border:none}

  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 110px);transform:translateX(-50%) translateY(20px);
    background:var(--panel2);color:var(--txt);padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:700;
    opacity:0;transition:.25s;z-index:80;border:1px solid var(--line);pointer-events:none;max-width:86%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ===== 撮影＝仕分け画面 ===== -->
<div id="scrCam" class="scr hide">
  <div class="top">
    <button class="tbtn" id="leftBtn">🗂 一覧</button>
    <div class="cardchip grow"><b id="camTitle">z.AibisCam</b><span class="sub" id="camSub">シャッターで撮影・1データ最大4枚</span></div>
    <span class="vertag" id="verTag"></span>
    <button class="tbtn" id="rightBtn">📥 <span class="cnt" id="rightCount">0</span></button>
  </div>

  <div id="camWrap">
    <video id="video" playsinline autoplay muted></video>
    <svg id="guide" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    <div class="gpschip" id="gpsChip"><span id="gpsTxt">📍 位置情報を取得中…</span></div>
    <div id="flashfx"></div>
    <div class="errcard hide" id="camErr">
      <div style="font-size:40px">📷</div>
      <div class="em" id="camErrMsg"></div>
      <button class="tbtn" style="background:var(--gold);color:#1a1300" id="fallbackBtn">標準カメラで撮る</button>
    </div>
  </div>

  <div id="setPanel" class="hide">
    <div class="setstrip"><div id="setThumbs" style="display:flex;gap:6px"></div><span class="setcnt" id="setCnt">0/4</span></div>
    <div class="addrline">
      <button class="mini" id="vGeo">🔄</button>
      <span class="at pend" id="vAddr">住所未取得</span>
    </div>
    <div class="banchiline">
      <button class="mini" id="vMap">🗺 地図</button>
      <button class="mini" id="vFix"><svg width="11" height="15" viewBox="0 0 24 34" style="vertical-align:-2px"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 22 12 22s12-13 12-22C24 5.4 18.6 0 12 0z" fill="#ff3b3b"/><circle cx="12" cy="12" r="5" fill="#fff"/></svg> 位置修正</button>
      <button class="mini" id="vLink">🔗 紐付け</button>
      <button class="mini danger" id="vDelSet" style="margin-left:auto">🗑 削除</button>
    </div>
    <div class="banchiline">
      <span class="bl">番地</span>
      <input id="vBanchi" class="banchi" placeholder="例 23-5" readonly>
    </div>
    <div class="notewrap">
      <button class="micbtn" id="vMic" title="音声入力">🎤</button>
      <input id="vNote" placeholder="計画地備考（任意）">
    </div>
  </div>

  <div class="shootbar">
    <button class="iconbtn" id="torchBtn" title="ライト">🔦</button>
    <button class="shutter" id="shutter" aria-label="撮影"></button>
    <button class="donebtn" id="doneBtn"><b>✓</b><s>完了</s></button>
  </div>
  <input type="file" id="nativeCam" accept="image/*" capture="environment" class="hide">
</div>

<!-- ===== インボックス ===== -->
<div id="scrInbox" class="scr hide">
  <div class="top">
    <button class="tbtn" id="inbBack">← 撮影</button>
    <div class="cardchip grow"><b id="inbTitle">📥 インボックス</b><span class="sub">タップで仕分け・続けて撮影</span></div>
  </div>
  <div class="pad">
    <div id="inbWarn" class="warnbar hide"></div>
    <div id="inbBody"></div>
    <div class="storeline" id="inbStore"></div>
  </div>
</div>

<!-- ===== カード一覧（撮影/閲覧 or 紐付け） ===== -->
<div id="scrPick" class="scr hide">
  <div class="top">
    <button class="tbtn" id="pickBack">📷 撮影</button>
    <div class="cardchip grow"><b class="ttl" id="pickTitle">⌘ カード一覧</b><span class="sub" id="pickSub">カードを選んで撮影・閲覧</span></div>
  </div>
  <div class="pad">
    <input class="search" id="pickSearch" placeholder="名前・担当・住所で検索">
    <div id="pickList"></div>
  </div>
</div>

<!-- ===== カード別ギャラリー ===== -->
<div id="scrGal" class="scr hide">
  <div class="top">
    <button class="tbtn" id="galBack">←</button>
    <div class="cardchip grow"><b id="galCardName">—</b><span class="sub" id="galCardMeta"></span></div>
    <button class="tbtn" style="background:var(--gold);color:#1a1300" id="galShoot">📷 撮る</button>
  </div>
  <div class="pad">
    <div id="galBody"></div>
    <div class="storeline" id="storeLine"></div>
  </div>
</div>

<!-- ===== 単写真ビューア ===== -->
<div id="viewer" class="hide">
  <div class="vtop">
    <button class="tbtn" id="vClose">✕</button>
    <div class="cardchip grow"><b style="font-size:13px;color:var(--gold)">計画地写真</b><span class="sub" id="vWhen"></span></div>
  </div>
  <img id="vImg" alt="">
  <div class="vacts">
    <button class="vbtn danger" id="vDelPhoto">🗑 この写真を削除</button>
  </div>
</div>

<!-- ===== 数字キーパッド ===== -->
<div id="keypad" class="hide">
  <div class="kpcard">
    <div class="kphead"><span>番地を入力</span><span id="kpVal">—</span></div>
    <div class="kpgrid">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="-" class="kpsub">−</button><button data-k="0">0</button><button data-k="bs" class="kpsub">⌫</button>
    </div>
    <div class="kpacts">
      <button id="kpClear" class="kpx">クリア</button>
      <button id="kpDone" class="kpok">完了</button>
    </div>
  </div>
</div>

<!-- ===== 位置修正マップ ===== -->
<div id="mapEdit" class="hide">
  <div class="vtop">
    <button class="tbtn" id="meCancel">✕ 取消</button>
    <div class="cardchip grow"><b style="font-size:13px;color:var(--gold)">📍 位置を修正</b><span class="sub">地図を動かして中心に合わせる</span></div>
    <button class="tbtn" style="background:var(--gold);color:#1a1300" id="meSave">保存</button>
  </div>
  <div id="leafWrap">
    <div id="leafMap"></div>
    <div id="centerPin"><svg width="34" height="46" viewBox="0 0 24 34"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 22 12 22s12-13 12-22C24 5.4 18.6 0 12 0z" fill="#ff3b3b" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="12" r="5" fill="#fff"/></svg></div>
  </div>
  <div class="mefoot">
    <button class="vbtn" id="meHere">📍 現在地に移動</button>
    <span id="meHint" class="mehint">地図を動かして、中心のピンを正しい場所に合わせてください</span>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* =========================================================
   z.Aibis カメラ v1.10  ── 1データ＝計画地写真 最大4枚（A4 4分割印刷を想定）
   連携契約:
   - カード一覧: localStorage['prospect_cards_v1'] を読み取り専用で参照
   - 写真データ: IndexedDB 'aibis_media_v1' / store 'photos'(keyPath id, index by_card,by_ts)
   - 件数索引: localStorage['aibis_media_index_v1'] = {cardId:{n,last}}（実カードのみ・件数=データ数）
   ※ prospect_cards_v1 には書き込まない（新規カード作成・PC連携は本体側）
   データ(set): {id,cardId,ts,addrType:'plan',lat,lng,acc,addr,addrPending,banchi,note,sent,photos:[{pid,full(Blob),thumb,w,h,size}]}
   ========================================================= */
const APP_VERSION = "cam-v1.14";
const SK_CARDS = "prospect_cards_v1";
const IDX_KEY  = "aibis_media_index_v1";
const DB_NAME  = "aibis_media_v1";
const STORE    = "photos";
const INBOX    = "__inbox__";
const MAX_PHOTOS = 4;       // 1データ＝最大4枚（A4 4分割）
const MAX_EDGE = 1600;      // 印刷向け解像度（長辺px）
const JPEG_Q   = 0.75;
const THUMB_EDGE = 260;
const WARN_SOFT = 10;       // この件数でPC送信を促す
const WARN_HARD = 15;       // この件数で強めに促す
const GSI_URL = "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress";
const GSI_MUNI_URL = "https://maps.gsi.go.jp/js/muni.js";
const TOKYO_WARDS = {
  "13101":{pref:"東京都",city:"千代田区"},"13102":{pref:"東京都",city:"中央区"},"13103":{pref:"東京都",city:"港区"},
  "13104":{pref:"東京都",city:"新宿区"},"13105":{pref:"東京都",city:"文京区"},"13106":{pref:"東京都",city:"台東区"},
  "13107":{pref:"東京都",city:"墨田区"},"13108":{pref:"東京都",city:"江東区"},"13109":{pref:"東京都",city:"品川区"},
  "13110":{pref:"東京都",city:"目黒区"},"13111":{pref:"東京都",city:"大田区"},"13112":{pref:"東京都",city:"世田谷区"},
  "13113":{pref:"東京都",city:"渋谷区"},"13114":{pref:"東京都",city:"中野区"},"13115":{pref:"東京都",city:"杉並区"},
  "13116":{pref:"東京都",city:"豊島区"},"13117":{pref:"東京都",city:"北区"},"13118":{pref:"東京都",city:"荒川区"},
  "13119":{pref:"東京都",city:"板橋区"},"13120":{pref:"東京都",city:"練馬区"},"13121":{pref:"東京都",city:"足立区"},
  "13122":{pref:"東京都",city:"葛飾区"},"13123":{pref:"東京都",city:"江戸川区"}
};

/* ---------- 状態 ---------- */
let DB=null, stream=null, track=null, geoWatch=null, lastPos=null;
let mode="quick", targetCard=INBOX, curSet=null, fromAibis=false, facing="environment", torchOn=false, capturing=false;
let viewPhoto=null, pickMode="open", linkTargetId=null, MUNI=null, micRec=null, kpVal="";
let leafMap=null, meTargetId=null;

const $ = id => document.getElementById(id);
const screens = {cam:$("scrCam"), inbox:$("scrInbox"), pick:$("scrPick"), gal:$("scrGal")};
function show(name){ for(const k in screens) screens[k].classList.toggle("hide", k!==name); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2100); }
const rid = p => p+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);

/* ---------- IndexedDB ---------- */
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains(STORE)){
        const os=db.createObjectStore(STORE,{keyPath:"id"});
        os.createIndex("by_card","cardId",{unique:false});
        os.createIndex("by_ts","ts",{unique:false});
      }
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
function tx(m){ return DB.transaction(STORE,m).objectStore(STORE); }
function idbPut(rec){ return new Promise((res,rej)=>{ const q=tx("readwrite").put(rec); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }
function idbDel(id){ return new Promise((res,rej)=>{ const q=tx("readwrite").delete(id); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }
function idbGetRaw(id){ return new Promise((res,rej)=>{ const q=tx("readonly").get(id); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbGet(id){ return normalize(await idbGetRaw(id)); }
function idbByCard(cardId){
  return new Promise((res,rej)=>{
    const out=[], idx=tx("readonly").index("by_card"), q=idx.openCursor(IDBKeyRange.only(cardId));
    q.onsuccess=()=>{ const c=q.result; if(c){ out.push(normalize(c.value)); c.continue(); } else { out.sort((a,b)=>a.ts-b.ts); res(out); } };
    q.onerror=()=>rej(q.error);
  });
}
function idbCountByCard(cardId){
  return new Promise((res)=>{ const idx=tx("readonly").index("by_card"); const q=idx.count(IDBKeyRange.only(cardId));
    q.onsuccess=()=>res(q.result||0); q.onerror=()=>res(0); });
}
/* 旧形式(1枚=1レコード)を set 形式に正規化 */
function normalize(rec){
  if(!rec) return rec;
  if(Array.isArray(rec.photos)) return rec;
  rec.photos=[{pid:(rec.id||rid("p"))+"_0", full:rec.full, thumb:rec.thumb, w:rec.w, h:rec.h, size:rec.size}];
  if(rec.sent===undefined) rec.sent=false;
  if(rec.banchi===undefined) rec.banchi="";
  return rec;
}
const setSize = s => (s.photos||[]).reduce((a,p)=>a+(p.size||0),0);

/* ---------- 件数索引(localStorage) ---------- */
function readIndex(){ try{ return JSON.parse(localStorage.getItem(IDX_KEY)||"{}"); }catch(e){ return {}; } }
async function refreshIndex(cardId){
  if(!cardId||cardId===INBOX) return;
  const n=await idbCountByCard(cardId), idx=readIndex();
  if(n>0) idx[cardId]={n, last:Date.now()}; else delete idx[cardId];
  try{ localStorage.setItem(IDX_KEY, JSON.stringify(idx)); }catch(e){}
}

/* ---------- カード読込(read-only) ---------- */
function loadCards(){ try{ const a=JSON.parse(localStorage.getItem(SK_CARDS)||"[]"); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function findCard(id){ return loadCards().find(c=>c.id===id)||null; }
function cardLabel(id){ const c=findCard(id); return c?(c.name||"無名")+"様":"カード "+String(id).slice(0,8)+"…"; }
function cardMeta(id){ const c=findCard(id); return c?[c.manager,c.address||c.plan_address].filter(Boolean).join("・"):""; }

/* ---------- 起動 ---------- */
async function boot(){
  $("verTag").textContent=APP_VERSION.replace("cam-","");
  try{ DB=await openDB(); }catch(e){ toast("保存領域を開けませんでした"); }
  if(navigator.storage&&navigator.storage.persist){ try{ await navigator.storage.persist(); }catch(e){} }
  loadMuni();
  const p=new URLSearchParams(location.search), cid=p.get("cardId");
  if(cid){ fromAibis=true; enterCamera(cid); } else { enterQuick(); }
}

/* ---------- 画面遷移 ---------- */
function configureHeader(){
  if(mode==="card"){
    $("camTitle").textContent=cardLabel(targetCard);
    $("camSub").textContent=cardMeta(targetCard)||"このカードに撮影";
    $("leftBtn").textContent= fromAibis ? "← アイビス" : "🗂 一覧";
    $("rightBtn").innerHTML='🖼 <span class="cnt" id="rightCount">0</span>';
  } else {
    $("camTitle").textContent="z.AibisCam";
    $("camSub").textContent="シャッターで撮影・1データ最大4枚";
    $("leftBtn").textContent="🗂 一覧";
    $("rightBtn").innerHTML='📥 <span class="cnt" id="rightCount">0</span>';
  }
}
async function enterQuick(){ mode="quick"; targetCard=INBOX; curSet=null; configureHeader(); show("cam"); await startCamera(); renderSetPanel(); await updateRightCount(); }
async function enterCamera(cardId){ mode="card"; targetCard=cardId; curSet=null; configureHeader(); show("cam"); await startCamera(); renderSetPanel(); await updateRightCount(); }
async function openSet(id){
  const s=await idbGet(id); if(!s) return;
  curSet=id; targetCard=s.cardId;
  mode=(s.cardId&&s.cardId!==INBOX)?"card":"quick"; fromAibis=false;
  configureHeader(); show("cam"); await startCamera(); renderSetPanel(); await updateRightCount();
}

$("leftBtn").addEventListener("click",()=>{
  stopCamera();
  if(mode==="card" && fromAibis){ if(history.length>1) history.back(); else toast("アイビスのタブに戻ってください"); }
  else openPick("open");
});
$("rightBtn").addEventListener("click",()=>{ if(mode==="quick") openInbox(); else openGallery(targetCard,true); });
async function updateRightCount(){
  const n=await idbCountByCard(targetCard); const el=$("rightCount"); if(!el) return;
  el.textContent=n; el.classList.remove("warn","over");
  if(mode==="quick"){ if(n>=WARN_HARD) el.classList.add("over"); else if(n>=WARN_SOFT) el.classList.add("warn"); }
}

/* ---------- カメラ制御 ---------- */
async function startCamera(){
  $("camErr").classList.add("hide"); stopCamera();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ showCamErr("このブラウザはカメラに対応していません。"); return; }
  try{
    stream=await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ideal:facing}, width:{ideal:2560}, height:{ideal:1440} } });
    const v=$("video"); v.srcObject=stream; await v.play().catch(()=>{});
    track=stream.getVideoTracks()[0];
    const caps=track.getCapabilities?track.getCapabilities():{};
    $("torchBtn").style.display = caps.torch ? "flex":"none";
    torchOn=false; $("torchBtn").classList.remove("on");
    $("shutter").disabled=false;
    drawGuide(); startGeo();
  }catch(e){
    let m="カメラを起動できませんでした。";
    if(e&&e.name==="NotAllowedError") m="カメラの使用が許可されていません。ブラウザの権限設定でこのサイトのカメラを許可してください。";
    else if(e&&e.name==="NotFoundError") m="カメラが見つかりませんでした。";
    showCamErr(m);
  }
}
function stopCamera(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; track=null; } stopGeo(); }
function showCamErr(msg){ $("camErrMsg").textContent=msg; $("camErr").classList.remove("hide"); $("shutter").disabled=true; }
function drawGuide(){ $("guide").innerHTML='<g class="grid"><line x1="33.3" y1="0" x2="33.3" y2="100"/><line x1="66.6" y1="0" x2="66.6" y2="100"/><line x1="0" y1="33.3" x2="100" y2="33.3"/><line x1="0" y1="66.6" x2="100" y2="66.6"/></g>'; }
$("torchBtn").addEventListener("click",async()=>{
  if(!track) return; torchOn=!torchOn;
  try{ await track.applyConstraints({advanced:[{torch:torchOn}]}); $("torchBtn").classList.toggle("on",torchOn); }
  catch(e){ toast("ライト非対応の端末です"); torchOn=false; }
});

/* ---------- 位置情報 ---------- */
function startGeo(){
  if(!navigator.geolocation){ $("gpsTxt").innerHTML="📍 位置情報に未対応の端末"; return; }
  if(geoWatch!=null) return;
  $("gpsTxt").innerHTML="📍 位置情報を取得中…";
  geoWatch=navigator.geolocation.watchPosition(
    pos=>{ lastPos={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};
      const m=lastPos.acc?Math.round(lastPos.acc):null;
      $("gpsTxt").innerHTML="📍 位置OK"+(m!=null?"（±"+m+"m）":"")+" 計画地で保存・ズレは後で修正可"; },
    err=>{ $("gpsTxt").innerHTML="📍 位置を取得できません（後で仕分け可）"; },
    {enableHighAccuracy:true, maximumAge:0, timeout:15000}
  );
}
function stopGeo(){ if(geoWatch!=null){ navigator.geolocation.clearWatch(geoWatch); geoWatch=null; } }

/* ---------- 地理院＋自治体マスター ---------- */
async function loadMuni(){
  if(MUNI) return MUNI;
  let base=Object.assign({}, TOKYO_WARDS);
  try{ const c=localStorage.getItem("aibis_muni_v1"); if(c){ MUNI=Object.assign(base, JSON.parse(c)); return MUNI; } }catch(e){}
  try{
    const r=await fetch(GSI_MUNI_URL); const txt=await r.text();
    const map={}; const re=/"(\d{5})"\s*\]?\s*[:=]\s*['"]([^'"]+)['"]/g; let m;
    while((m=re.exec(txt))){ const parts=m[2].split(","); map[m[1]]={pref:parts[1]||"",city:parts[3]||parts[parts.length-1]||""}; }
    if(Object.keys(map).length){ try{ localStorage.setItem("aibis_muni_v1", JSON.stringify(map)); }catch(e){} base=Object.assign(base, map); }
  }catch(e){}
  MUNI=base; return MUNI;
}
async function gsiReverse(lat,lng){
  const r=await fetch(GSI_URL+"?lat="+lat+"&lon="+lng,{mode:"cors"});
  const j=await r.json(); const res=j&&j.results;
  let lv=res&&res.lv01Nm?String(res.lv01Nm):""; if(lv==="－"||lv==="−") lv="";
  const muni=res&&res.muniCd?String(res.muniCd):"";
  return {muni, lv};
}
async function composeAddress(lat,lng){
  const {muni,lv}=await gsiReverse(lat,lng);
  let pref="", city="";
  if(muni){ const M=await loadMuni(); const e=M&&(M[muni]||M[muni.slice(0,5)]); if(e){ pref=e.pref; city=e.city; } }
  let head=city; if(pref && pref!=="東京都") head=pref+city;
  return (head||"")+(lv||"");
}
async function resolveAddr(id){
  const p=await idbGet(id); if(!p||p.lat==null) return;
  try{ const a=await composeAddress(p.lat,p.lng); const cur=await idbGet(id); if(!cur) return;
    cur.addr=a||""; cur.addrPending=false; await idbPut(cur);
  }catch(e){ const cur=await idbGet(id); if(cur){ cur.addrPending=false; await idbPut(cur); } }
  if(!screens.inbox.classList.contains("hide")) renderInbox();
  if(curSet===id && !screens.cam.classList.contains("hide")) renderSetPanel();
}

/* ---------- 撮影（最大4枚で1データ） ---------- */
$("shutter").addEventListener("click",capture);
async function capture(){
  if(capturing) return;
  if(!track){ toast("カメラ未起動"); return; }
  const v=$("video"), vw=v.videoWidth, vh=v.videoHeight;
  if(!vw||!vh){ toast("準備中…もう一度"); return; }
  // 4枚チェック
  if(curSet){ const s=await idbGet(curSet); if(s && s.photos.length>=MAX_PHOTOS){
    toast("1データは4枚までです。不要な写真を削除するか「完了」で次のデータへ"); return; } }
  capturing=true;
  try{
    const fx=$("flashfx"); fx.classList.remove("go"); void fx.offsetWidth; fx.classList.add("go");
    const scale=Math.min(1, MAX_EDGE/Math.max(vw,vh));
    const w=Math.round(vw*scale), h=Math.round(vh*scale);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(v,0,0,w,h);
    const full=await new Promise(r=>cv.toBlob(r,"image/jpeg",JPEG_Q));
    const photo={ pid:rid("p"), full, thumb:makeThumb(cv,w,h), w, h, size:(full?full.size:0) };
    await addPhoto(photo);
    if(navigator.vibrate) navigator.vibrate(15);
  }catch(e){ toast("保存に失敗（容量不足の可能性）"); }
  capturing=false;
}
async function addPhoto(photo){
  if(curSet){
    const s=await idbGet(curSet); if(!s) { curSet=null; }
    else { s.photos.push(photo); await idbPut(s); renderSetPanel(); await updateRightCount(); return; }
  }
  // 新規データ
  if(targetCard===INBOX){ const n=await idbCountByCard(INBOX);
    if(n>=WARN_HARD) toast("インボックスが"+n+"件です。続けるなら先にPCへ送って整理しましょう");
    else if(n>=WARN_SOFT) toast("インボックス"+n+"件。そろそろPCへ送りましょう"); }
  const pos=lastPos;
  const s={ id:rid("s"), cardId:targetCard, ts:Date.now(), addrType:"plan",
    lat:pos?pos.lat:null, lng:pos?pos.lng:null, acc:pos?pos.acc:null,
    addr:"", addrPending:!!pos, banchi:"", note:"", sent:false, photos:[photo] };
  await idbPut(s); curSet=s.id; await refreshIndex(targetCard);
  renderSetPanel(); await updateRightCount();
  if(s.lat!=null) resolveAddr(s.id);
}
function makeThumb(srcCv,w,h){
  const sc=Math.min(1, THUMB_EDGE/Math.max(w,h));
  const tw=Math.round(w*sc), th=Math.round(h*sc);
  const t=document.createElement("canvas"); t.width=tw; t.height=th; t.getContext("2d").drawImage(srcCv,0,0,tw,th);
  return t.toDataURL("image/jpeg",0.65);
}
/* 標準カメラ フォールバック */
$("fallbackBtn").addEventListener("click",()=>$("nativeCam").click());
$("nativeCam").addEventListener("change",async e=>{
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  if(curSet){ const s=await idbGet(curSet); if(s&&s.photos.length>=MAX_PHOTOS){ toast("1データは4枚までです。"); e.target.value=""; return; } }
  const img=await blobToImage(file);
  const scale=Math.min(1,MAX_EDGE/Math.max(img.width,img.height));
  const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
  const full=await new Promise(r=>cv.toBlob(r,"image/jpeg",JPEG_Q));
  await addPhoto({ pid:rid("p"), full, thumb:makeThumb(cv,w,h), w, h, size:(full?full.size:0) });
  toast("保存しました"); e.target.value="";
});
function blobToImage(blob){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(blob); const im=new Image();
  im.onload=()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror=rej; im.src=u; }); }

/* 完了＝今のデータを確定し次のデータへ */
$("doneBtn").addEventListener("click",async()=>{
  if(!curSet){ toast("先に撮影してください"); return; }
  curSet=null; renderSetPanel(); await updateRightCount();
  toast("保存しました。次のデータへ");
});

/* ---------- 仕分けパネル ---------- */
let _objUrls=[];
function clearObjUrls(){ _objUrls.forEach(u=>URL.revokeObjectURL(u)); _objUrls=[]; }
async function renderSetPanel(){
  if(!curSet){ $("setPanel").classList.add("hide"); $("doneBtn").disabled=true; return; }
  const s=await idbGet(curSet); if(!s){ curSet=null; $("setPanel").classList.add("hide"); $("doneBtn").disabled=true; return; }
  $("setPanel").classList.remove("hide"); $("doneBtn").disabled=false;
  $("setThumbs").innerHTML=s.photos.map(p=>'<div class="sthumb" data-pid="'+esc(p.pid)+'"><img src="'+p.thumb+'"></div>').join("");
  $("setThumbs").querySelectorAll(".sthumb").forEach(el=>el.addEventListener("click",()=>openPhoto(curSet, el.dataset.pid)));
  const cnt=$("setCnt"); cnt.textContent=s.photos.length+"/"+MAX_PHOTOS; cnt.classList.toggle("full", s.photos.length>=MAX_PHOTOS);
  fillAddr(s); $("vBanchi").value=s.banchi||""; $("vNote").value=s.note||"";
}
function fillAddr(s){
  const el=$("vAddr");
  const full=s.addr?(s.addr+(s.banchi?(" "+s.banchi):"")):"";
  if(s.addr){ el.textContent=full; el.classList.remove("pend"); }
  else { el.textContent=s.addrPending?"住所を取得中…":(s.lat!=null?"住所未取得（🔄で再取得 / 🗺で確認）":"位置情報なし"); el.classList.add("pend"); }
  $("vMap").style.opacity=(s.lat!=null)?"1":".4";
  $("vFix").style.opacity=(s.lat!=null)?"1":".4";
  $("vGeo").style.opacity=(s.lat!=null)?"1":".4";
}
$("vGeo").addEventListener("click",async()=>{ const s=await idbGet(curSet); if(!s||s.lat==null){ toast("位置情報がありません"); return; }
  s.addrPending=true; await idbPut(s); fillAddr(s); toast("住所を取得中…"); resolveAddr(curSet); });
$("vMap").addEventListener("click",async()=>{ const s=await idbGet(curSet); if(!s||s.lat==null){ toast("位置情報がありません"); return; }
  window.open("https://www.google.com/maps?q="+s.lat+","+s.lng,"_blank"); });
$("vNote").addEventListener("blur",async()=>{ if(!curSet) return; const s=await idbGet(curSet); if(!s) return;
  if((s.note||"")!==$("vNote").value){ s.note=$("vNote").value; await idbPut(s); toast("計画地備考を保存"); } });
$("vMic").addEventListener("click",()=>{
  const btn=$("vMic");
  if(micRec){ try{ micRec.stop(); }catch(e){} return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("音声入力に未対応の端末です"); return; }
  const rec=new SR(); rec.lang="ja-JP"; rec.interimResults=false; rec.maxAlternatives=1;
  micRec=rec; btn.classList.add("rec"); btn.textContent="■";
  rec.onresult=e=>{ const t=e.results[0][0].transcript||""; const inp=$("vNote"); inp.value=(inp.value?inp.value+" ":"")+t; inp.dispatchEvent(new Event("blur")); };
  rec.onerror=()=>toast("音声を認識できませんでした");
  rec.onend=()=>{ micRec=null; btn.classList.remove("rec"); btn.textContent="🎤"; };
  try{ rec.start(); }catch(e){ micRec=null; btn.classList.remove("rec"); btn.textContent="🎤"; }
});
$("vLink").addEventListener("click",()=>{ if(!curSet) return; linkTargetId=curSet; openPick("link"); });
$("vDelSet").addEventListener("click",async()=>{
  if(!curSet) return; const s=await idbGet(curSet); if(!s) return;
  if(!confirm("このデータ（写真"+s.photos.length+"枚）を削除しますか？")) return;
  const card=s.cardId; await idbDel(curSet); await refreshIndex(card);
  curSet=null; renderSetPanel(); await updateRightCount(); toast("削除しました");
});

/* 番地キーパッド */
function openKeypad(){ if(!curSet) return; kpVal=$("vBanchi").value||""; $("kpVal").textContent=kpVal||"—"; $("keypad").classList.remove("hide"); }
$("vBanchi").addEventListener("click",openKeypad);
$("keypad").querySelectorAll(".kpgrid button").forEach(b=>b.addEventListener("click",()=>{
  const k=b.dataset.k;
  if(k==="bs") kpVal=kpVal.slice(0,-1);
  else if(k==="-"){ if(kpVal&&!kpVal.endsWith("-")) kpVal+="-"; }
  else kpVal+=k;
  $("kpVal").textContent=kpVal||"—";
}));
$("kpClear").addEventListener("click",()=>{ kpVal=""; $("kpVal").textContent="—"; });
$("kpDone").addEventListener("click",async()=>{
  $("keypad").classList.add("hide"); $("vBanchi").value=kpVal;
  const s=await idbGet(curSet); if(!s) return;
  if((s.banchi||"")!==kpVal){ s.banchi=kpVal; await idbPut(s); fillAddr(s); toast("番地を保存"); }
});
$("keypad").addEventListener("click",e=>{ if(e.target===$("keypad")) $("keypad").classList.add("hide"); });

/* ---------- インボックス ---------- */
async function openInbox(){ stopCamera(); show("inbox"); await renderInbox(); showStorage("inbStore"); }
$("inbBack").addEventListener("click",()=>{ enterQuick(); });
async function renderInbox(){
  const list=(await idbByCard(INBOX)).sort((a,b)=>b.ts-a.ts);
  $("inbTitle").textContent="📥 インボックス（"+list.length+"）";
  const warn=$("inbWarn");
  if(list.length>=WARN_HARD){ warn.className="warnbar hard"; warn.textContent="⚠ "+list.length+"件たまっています。これ以上撮るより、先にPCへ送って整理しましょう。"; }
  else if(list.length>=WARN_SOFT){ warn.className="warnbar soft"; warn.textContent="そろそろ"+list.length+"件です。区切りでPCへ送って整理するのがおすすめです。"; }
  else warn.className="warnbar hide";
  const host=$("inbBody");
  if(!list.length){ host.innerHTML='<div class="emptyst">未仕分けのデータはありません。<br>「← 撮影」から撮影できます。</div>'; return; }
  host.innerHTML=list.map(s=>drowHtml(s)).join("");
  bindDrows(host,"inbox");
}
function drowHtml(s){
  const full=s.addr?esc(s.addr+(s.banchi?(" "+s.banchi):"")):(s.addrPending?"住所を取得中…":(s.lat!=null?"住所未取得（地図で確認）":"位置情報なし"));
  const cls=s.addr?"ad":"ad pend";
  const sent=s.sent?'<span class="sentbadge">送信済</span>':"";
  return '<div class="drow" data-id="'+esc(s.id)+'">'+
    '<div class="th"><img src="'+(s.photos[0]?s.photos[0].thumb:"")+'"><span class="n">'+s.photos.length+'枚</span></div>'+
    '<div class="bd"><div class="'+cls+'">'+full+sent+'</div>'+
    '<div class="wn">'+fmtWhen(s.ts)+(s.note?'・'+esc(s.note):'')+'</div></div>'+
    '<button class="delbtn" data-del="'+esc(s.id)+'">🗑</button></div>';
}
function bindDrows(host,fromWhere){
  host.querySelectorAll(".drow").forEach(el=>el.addEventListener("click",e=>{
    if(e.target.closest(".delbtn")) return;
    openSet(el.dataset.id);
  }));
  host.querySelectorAll(".delbtn").forEach(b=>b.addEventListener("click",async()=>{
    const s=await idbGet(b.dataset.del); if(!s) return;
    if(!confirm("このデータ（写真"+s.photos.length+"枚）を削除しますか？")) return;
    const card=s.cardId; await idbDel(b.dataset.del); await refreshIndex(card);
    if(fromWhere==="inbox"){ await renderInbox(); showStorage("inbStore"); } else { await renderGallery(); showStorage("storeLine"); }
    toast("削除しました");
  }));
}

/* ---------- カード一覧 ---------- */
function openPick(m){
  pickMode=m||"open";
  $("pickBack").textContent = pickMode==="link" ? "← 戻る" : "📷 撮影";
  $("pickTitle").textContent = pickMode==="link" ? "🔗 紐付け先のカード" : "⌘ カード一覧";
  $("pickSub").textContent  = pickMode==="link" ? "このデータを紐付けるカードを選択" : "カードを選んで撮影・閲覧";
  renderPicker($("pickSearch").value); show("pick");
}
$("pickBack").addEventListener("click",()=>{
  if(pickMode==="link"){ openSet(linkTargetId); } else { enterQuick(); }
});
function renderPicker(filter){
  const idx=readIndex(); let cards=loadCards();
  const f=(filter||"").trim();
  if(f){ const lc=f.toLowerCase(); cards=cards.filter(c=>((c.name||"")+(c.manager||"")+(c.address||"")+(c.plan_address||"")).toLowerCase().includes(lc)); }
  cards.sort((a,b)=>{ const na=(idx[a.id]||{}).n||0, nb=(idx[b.id]||{}).n||0; if(nb!==na) return nb-na; return (b.discovery_date||"").localeCompare(a.discovery_date||""); });
  const host=$("pickList");
  if(!loadCards().length){ host.innerHTML='<div class="emptyst">アイビスのカードが見つかりません。<br>同じ端末・同じサイトでアイビスを一度開いてカードを作成してから、もう一度開いてください。</div>'; return; }
  if(!cards.length){ host.innerHTML='<div class="emptyst">該当するカードがありません。</div>'; return; }
  host.innerHTML=cards.slice(0,200).map(c=>{
    const n=(idx[c.id]||{}).n||0, meta=[c.manager,c.address||c.plan_address].filter(Boolean).join("・");
    return '<div class="crow" data-id="'+esc(c.id)+'"><div class="grow" style="min-width:0"><div class="nm">'+esc(c.name||"無名")+'様</div><div class="mt">'+esc(meta||"—")+'</div></div><div class="pc"><b>'+n+'</b><s>件</s></div></div>';
  }).join("");
  host.querySelectorAll(".crow").forEach(el=>el.addEventListener("click",()=>onPickCard(el.dataset.id)));
}
$("pickSearch").addEventListener("input",e=>renderPicker(e.target.value));
async function onPickCard(cardId){
  if(pickMode==="link"){
    const s=await idbGet(linkTargetId); if(!s){ toast("データが見つかりません"); return; }
    const old=s.cardId; s.cardId=cardId; await idbPut(s);
    await refreshIndex(cardId); await refreshIndex(old);
    toast(cardLabel(cardId)+" に紐付けました"); pickMode="open"; openSet(linkTargetId);
  } else { fromAibis=false; enterCamera(cardId); }
}

/* ---------- カード別ギャラリー ---------- */
async function openGallery(cardId,cameFromCam){
  targetCard=cardId; openGallery._fromCam=!!cameFromCam;
  $("galCardName").textContent=cardLabel(cardId); $("galCardMeta").textContent=cardMeta(cardId);
  show("gal"); stopCamera(); await renderGallery(); showStorage("storeLine");
}
async function renderGallery(){
  const list=(await idbByCard(targetCard)).sort((a,b)=>b.ts-a.ts);
  const host=$("galBody");
  if(!list.length){ host.innerHTML='<div class="emptyst">まだ写真がありません。<br>「📷 撮る」から撮影してください。</div>'; return; }
  host.innerHTML='<div class="galsec">計画地データ（'+list.length+'件）</div>'+list.map(s=>drowHtml(s)).join("");
  bindDrows(host,"gal");
}
$("galBack").addEventListener("click",()=>{ if(openGallery._fromCam){ enterCamera(targetCard); } else { openPick("open"); } });
$("galShoot").addEventListener("click",()=>{ openGallery._fromCam=true; enterCamera(targetCard); });

/* ---------- 容量表示 ---------- */
async function showStorage(targetId){
  let line="";
  if(navigator.storage&&navigator.storage.estimate){ try{ const est=await navigator.storage.estimate(); line="使用容量 "+fmtMB(est.usage)+" / 上限目安 "+fmtMB(est.quota); }catch(e){} }
  $(targetId).textContent=line;
}
const fmtMB = b => b? (b>1073741824? (b/1073741824).toFixed(1)+"GB" : Math.round(b/1048576)+"MB") : "—";

/* ---------- 単写真ビューア（左右フリックでめくる） ---------- */
let viewSet=null, viewIdx=0;
async function openPhoto(setId,pid){
  const s=await idbGet(setId); if(!s) return;
  const i=s.photos.findIndex(p=>p.pid===pid); if(i<0) return;
  viewSet=s; showPhotoAt(i);
  $("viewer").classList.remove("hide");
}
function showPhotoAt(i){
  if(!viewSet||!viewSet.photos.length) return;
  i=Math.max(0,Math.min(i, viewSet.photos.length-1)); viewIdx=i;
  const p=viewSet.photos[i]; viewPhoto={setId:viewSet.id, pid:p.pid};
  clearObjUrls(); const u=URL.createObjectURL(p.full); _objUrls.push(u);
  $("vImg").src=u; $("vWhen").textContent=(i+1)+"/"+viewSet.photos.length+"・"+(p.w+"×"+p.h)+"・"+fmtMB(p.size);
}
let _tsx=0,_tsy=0;
$("viewer").addEventListener("touchstart",e=>{ const t=e.changedTouches[0]; _tsx=t.clientX; _tsy=t.clientY; },{passive:true});
$("viewer").addEventListener("touchend",e=>{
  const t=e.changedTouches[0], dx=t.clientX-_tsx, dy=t.clientY-_tsy;
  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){ if(dx<0) showPhotoAt(viewIdx+1); else showPhotoAt(viewIdx-1); }
},{passive:true});
$("vClose").addEventListener("click",()=>{ $("viewer").classList.add("hide"); viewPhoto=null; viewSet=null; });
$("vDelPhoto").addEventListener("click",async()=>{
  if(!viewPhoto) return;
  if(!confirm("この写真を削除しますか？")) return;
  const s=await idbGet(viewPhoto.setId); if(!s) return;
  s.photos=s.photos.filter(p=>p.pid!==viewPhoto.pid);
  let closed=false;
  if(!s.photos.length){ await idbDel(s.id); await refreshIndex(s.cardId); if(curSet===s.id) curSet=null; closed=true; }
  else { await idbPut(s); }
  if(!screens.cam.classList.contains("hide")) renderSetPanel();
  if(!screens.inbox.classList.contains("hide")) renderInbox();
  if(!screens.gal.classList.contains("hide")) renderGallery();
  await updateRightCount(); toast("削除しました");
  if(closed){ $("viewer").classList.add("hide"); viewPhoto=null; viewSet=null; }
  else { viewSet=s; showPhotoAt(Math.min(viewIdx, s.photos.length-1)); } // 残りを表示し続ける
});

/* ---------- 位置修正（Leaflet 中心ピン固定） ---------- */
function loadLeaflet(){
  return new Promise((res,rej)=>{
    if(window.L) return res();
    const css=document.createElement("link"); css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
    const js=document.createElement("script"); js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; js.onload=()=>res(); js.onerror=()=>rej(new Error("leaflet")); document.head.appendChild(js);
  });
}
$("vFix").addEventListener("click",async()=>{
  const s=await idbGet(curSet); if(!s||s.lat==null){ toast("位置情報がありません"); return; }
  meTargetId=curSet;
  try{ await loadLeaflet(); }
  catch(e){
    if(navigator.geolocation){ toast("地図を読み込めません。現在地で取り直します");
      navigator.geolocation.getCurrentPosition(async pos=>{ const cur=await idbGet(meTargetId); if(!cur) return;
        cur.lat=pos.coords.latitude; cur.lng=pos.coords.longitude; cur.acc=pos.coords.accuracy; cur.addrPending=true; await idbPut(cur); fillAddr(cur); resolveAddr(meTargetId); toast("現在地に補正しました");
      },()=>toast("現在地を取得できませんでした"),{enableHighAccuracy:true,maximumAge:0,timeout:15000});
    } else toast("地図も現在地も利用できません");
    return;
  }
  $("mapEdit").classList.remove("hide"); setTimeout(()=>initLeaflet(s.lat,s.lng),60);
});
function initLeaflet(lat,lng){
  if(!leafMap){
    leafMap=L.map("leafMap",{zoomControl:true}).setView([lat,lng],18);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,attribution:"© OpenStreetMap"}).addTo(leafMap);
  } else { leafMap.setView([lat,lng],18); }
  setTimeout(()=>leafMap.invalidateSize(),80);
}
$("meHere").addEventListener("click",()=>{
  if(!navigator.geolocation){ toast("現在地に未対応"); return; }
  navigator.geolocation.getCurrentPosition(pos=>{ if(leafMap) leafMap.setView([pos.coords.latitude,pos.coords.longitude],18); },()=>toast("現在地を取得できませんでした"),{enableHighAccuracy:true,maximumAge:0,timeout:15000});
});
$("meCancel").addEventListener("click",()=>$("mapEdit").classList.add("hide"));
$("meSave").addEventListener("click",async()=>{
  if(!leafMap){ $("mapEdit").classList.add("hide"); return; }
  const c=leafMap.getCenter(); const s=await idbGet(meTargetId); if(!s){ $("mapEdit").classList.add("hide"); return; }
  s.lat=c.lat; s.lng=c.lng; s.acc=null; s.addrPending=true; await idbPut(s);
  $("mapEdit").classList.add("hide"); fillAddr(s); resolveAddr(meTargetId); toast("位置を修正しました");
});

/* ---------- util ---------- */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtWhen(ts){ const d=new Date(ts), p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ stopCamera(); }
  else if(!screens.cam.classList.contains("hide")){ startCamera(); }
});
window.addEventListener("pagehide",stopCamera);

boot();
</script>
